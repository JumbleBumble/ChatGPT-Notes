name: CI

on:
    pull_request:
    workflow_dispatch:

jobs:
    test-and-build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm run test:run

            - name: Run coverage
              run: npm run test:coverage

            - name: Build extension
              run: npm run build
